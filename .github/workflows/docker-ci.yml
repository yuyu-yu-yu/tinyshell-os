name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/yuyu-yu-yu/tinyshell-os-dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build development image
        run: docker build --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Build and boot TinyShell OS
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            make clean test

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish canonical toolchain image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:toolchain-v1"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:toolchain-v1"
